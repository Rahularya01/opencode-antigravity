name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: this workflow only reads the repo and never needs
# to push, comment, or publish, so it gets no other GITHUB_TOKEN permissions.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # --frozen-lockfile refuses to silently re-resolve dependencies: if
      # bun.lock and package.json disagree, CI fails instead of installing
      # something nobody reviewed.
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
